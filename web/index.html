<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Copystar - Premium Printing Solutions">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Copystar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Copystar - Web</title>
  <link rel="manifest" href="manifest.json">

  <!-- ========================================== -->
  <!-- 3D LOADING SCREEN CSS -->
  <!-- ========================================== -->
  <style>
    * { box-sizing: border-box; }

    body {
      background: radial-gradient(circle at center, #1f1f1f 0%, #121212 100%);
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1f1f1f 0%, #121212 100%);
      z-index: 9999;
      transition: opacity 0.8s ease-out;
    }

    /* Perspective wrapper - gives real 3D space to the child */
    .scene {
      perspective: 900px;
    }

    /* 3D Text Animation */
    .text-3d {
      font-family: 'Arial', sans-serif;
      font-size: 46px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      transform-style: preserve-3d;
      animation: float3d 3.2s infinite ease-in-out, glowPulse 2.4s infinite ease-in-out;

      /* Layered shadow = extruded 3D depth */
      text-shadow: 
        0 1px 0 #cccccc,
        0 2px 0 #b3b3b3,
        0 3px 0 #999999,
        0 4px 0 #808080,
        0 5px 0 #666666,
        0 6px 1px rgba(0,0,0,0.1),
        0 0 5px rgba(0,0,0,0.1),
        0 1px 3px rgba(0,0,0,0.3),
        0 3px 5px rgba(0,0,0,0.2),
        0 5px 10px rgba(0,0,0,0.25),
        0 10px 10px rgba(0,0,0,0.2),
        0 20px 20px rgba(0,0,0,0.15),
        0 0 40px rgba(74, 144, 226, 0.5);
    }

    /* Rotates on X and Y both -> genuine tumbling 3D feel */
    @keyframes float3d {
      0%   { transform: rotateX(15deg) rotateY(-12deg) translateY(0px); }
      25%  { transform: rotateX(-6deg) rotateY(10deg) translateY(-14px); }
      50%  { transform: rotateX(-14deg) rotateY(-10deg) translateY(-22px); }
      75%  { transform: rotateX(6deg) rotateY(12deg) translateY(-10px); }
      100% { transform: rotateX(15deg) rotateY(-12deg) translateY(0px); }
    }

    /* Blue glow breathing effect */
    @keyframes glowPulse {
      0%, 100% { filter: drop-shadow(0 0 12px rgba(74,144,226,0.35)); }
      50%      { filter: drop-shadow(0 0 26px rgba(74,144,226,0.75)); }
    }

    /* Premium Spinner - dual ring for extra polish */
    .spinner-wrap {
      position: relative;
      margin-top: 55px;
      width: 54px;
      height: 54px;
    }

    .spinner-wrap .ring {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 4px solid transparent;
    }

    .spinner-wrap .ring:nth-child(1) {
      border-top-color: #4A90E2;
      border-right-color: rgba(74,144,226,0.3);
      animation: spin 1s linear infinite;
    }

    .spinner-wrap .ring:nth-child(2) {
      width: 70%;
      height: 70%;
      top: 15%;
      left: 15%;
      border-bottom-color: #ffffff;
      animation: spin 1.4s linear infinite reverse;
      opacity: 0.6;
    }

    @keyframes spin { 
      100% { transform: rotate(360deg); } 
    }
  </style>
</head>
<body>

  <!-- ========================================== -->
  <!-- HTML FOR LOADING SCREEN -->
  <!-- ========================================== -->
  <div id="loading-container">
    <div class="scene">
      <div class="text-3d">Welcome to<br>Copystar</div>
    </div>
    <div class="spinner-wrap">
      <div class="ring"></div>
      <div class="ring"></div>
    </div>
  </div>

  <!-- FLUTTER BOOTSTRAP SCRIPT -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- ========================================== -->
  <!-- LOGIC TO HIDE LOADER WHEN APP IS READY -->
  <!-- ========================================== -->
  <script>
    window.addEventListener("flutter-first-frame", function() {
      var loader = document.getElementById("loading-container");
      if (loader) {
        loader.style.opacity = "0";
        setTimeout(function() {
          loader.remove();
        }, 800); 
      }
    });
  </script>
  
</body>
</html>
